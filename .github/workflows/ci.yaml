name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run tests
        run: deno test --allow-read --allow-write --allow-net

      - name: Type check
        run: deno check src/**/*.ts

      - name: Lint code
        run: deno lint src/

      - name: Format check
        run: deno fmt --check src/

  # Prevent merging if tests fail
  require-tests:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed. Cannot proceed with merge."
            exit 1
          fi
          echo "All tests passed!"
